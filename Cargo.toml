[package]
name = "vulnhound"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Vulnerability scanner for Linux and Windows hosts"
repository = "https://github.com/MarkHmnv/vulnhound"

[dependencies]
anstyle = "1.0.14"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = [
  "std",
  "alloc",
] }
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.1"

# Kernel CVE data (OSV export) is Linux-only.
[target.'cfg(not(windows))'.dependencies]
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
